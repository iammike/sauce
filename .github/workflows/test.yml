name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every version band engines.node (">=22.12 <23 || >=24") permits:
      # its floor, the maintenance line deploy.yml runs on, and Active LTS.
      #
      # 22.12 is pinned because '22' resolves to the newest 22.x, so nothing
      # would otherwise run the declared floor — and a dependency raising its
      # own floor above engines.node, while staying below whatever '22'
      # resolves to, would pass CI while being broken for anyone on a version
      # package.json claims to support. .npmrc makes engines enforced rather
      # than advisory, so an untested band is a promise npm keeps on our
      # behalf without anything checking it.
      #
      # The floor is 22.12 because jsdom is CJS but require()s ESM-only
      # dependencies, so it needs require(esm) — which landed in 20.19 and
      # 22.12. Node 20 is excluded for being EOL (2026-04-30) and untested
      # here, not because it cannot work. 23 the range rejects outright; 25
      # the range permits but no job runs, because it is EOL.
      #
      # This list is not self-maintaining: `>=24` is open-ended, so a new
      # even-numbered major is installable the day it ships with nothing
      # having run it. Add an entry when one lands.
      matrix:
        node-version: ['22.12', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    # Browser rendering, not Node compat — one run is enough, unlike the
    # node-version matrix above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
